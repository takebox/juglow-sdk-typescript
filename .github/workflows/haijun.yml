name: Haijun Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  haijun:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@haijun')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@haijun') || contains(github.event.issue.title, '@haijun')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Haijun to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Haijun Code
        id: haijun
        uses: takebox/haijun-code-action@v1
        with:
          juglow_api_key: ${{ secrets.HAIJUN_API_KEY }}

          # This is an optional setting that allows Haijun to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Haijun. If this is not specified, Haijun will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add haijun_args to customize behavior and configuration
          # See https://github.com/takebox/haijun-code-action/blob/main/docs/usage.md
          # or https://code.juglow.my.id/docs/en/cli-reference for available options
          # haijun_args: '--allowed-tools Bash(gh pr:*)'
